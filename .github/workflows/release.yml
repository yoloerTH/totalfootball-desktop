# A tag v* builds, signs, notarizes and publishes a DRAFT release with the
# installers and the update feed (latest-mac.yml, latest.yml). Publish the draft
# on GitHub to ship it; the apps pick it up within six hours.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   MAC_CERT_P12_BASE64   Developer ID Application certificate + key, .p12, base64
#   MAC_CERT_PASSWORD     its password
#   APPLE_API_KEY_P8      App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID      its key id
#   APPLE_API_ISSUER      its issuer id
# GITHUB_TOKEN is provided by Actions.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: macOS
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          npm run release:mac

      - name: Windows (unsigned in v1)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release:win
