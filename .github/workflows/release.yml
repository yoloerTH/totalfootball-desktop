# A tag v* builds, signs, notarizes and publishes a DRAFT release with the
# installers and the update feed (latest-mac.yml, latest.yml). Publish the draft
# on GitHub to ship it; the apps pick it up within six hours.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   MAC_CERT_P12_BASE64   Developer ID Application certificate + key, .p12, base64
#   MAC_CERT_PASSWORD     its password
#   APPLE_API_KEY_P8      App Store Connect API key (.p8 file contents)
#   APPLE_API_KEY_ID      its key id
#   APPLE_API_ISSUER      its issuer id
# GITHUB_TOKEN is provided by Actions.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for both builds. Without it the Mac and Windows jobs each made a
  # draft for the same tag at the same moment (v1.0.0, 2026-10-08); electron-builder
  # uploads into a draft that already exists.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ -z "$(gh api "repos/$GITHUB_REPOSITORY/releases" -q ".[] | select(.tag_name==\"$V\") | .id")" ]; then
            gh release create "$V" --repo "$GITHUB_REPOSITORY" --draft --title "${V#v}" --notes "" --target "$GITHUB_SHA"
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # electron-builder's own keychain import (CSC_LINK) fails on current macOS
      # runners: `security set-key-partition-list` cannot unlock the temporary
      # keychain it makes (v1.0.0's first run, 2026-10-08). So the certificate goes
      # into a keychain made here, and electron-builder finds the identity by name.
      - name: Signing keychain (macOS)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -hex 24)"
          printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: macOS
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_NAME: 'NAURRA AI LTD (47PRW874GS)'
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          npm run release:mac

      - name: Windows (unsigned in v1)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run release:win
