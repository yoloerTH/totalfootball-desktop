<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
<title>Total Football Studio</title>
<style>
  :root { --paper: #F4F4F2; --ink: #161618; --soft: #5b5b60; --gold: #E6B23A; }
  @media (prefers-color-scheme: dark) { :root { --paper: #0A0C0B; --ink: #F4F4F2; --soft: #a3a3a8; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display: grid; place-items: center; -webkit-user-select: none; user-select: none; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: var(--soft); margin: 0 0 22px; }
  button { background: var(--gold); color: #161618; border: 0; border-radius: 12px; padding: 12px 26px;
    font: 800 15px/1 inherit; font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6B23A"/><stop offset=".45" stop-color="#C9902B"/><stop offset="1" stop-color="#08C16A"/></linearGradient></defs>
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#g)" stroke-width="4"/>
    <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="3"/>
    <polygon points="50,40 59.5,47 56,58 44,58 40.5,47" fill="currentColor"/>
  </svg>
  <h1>You're offline</h1>
  <p>Total Football Studio keeps your boards in your account, so it needs the internet. Check your connection and try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  // Back to the page that failed, but only ever one of ours (main also guards navigation).
  var target = new URLSearchParams(location.search).get('url') || 'https://totalfootballstudio.com/studio/portal/'
  var ok = /^https:\/\/(www\.)?totalfootballstudio\.com\//.test(target) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(target)
  if (!ok) target = 'https://totalfootballstudio.com/studio/portal/'
  var btn = document.getElementById('retry')
  function retry() { btn.disabled = true; btn.textContent = 'Connecting…'; location.href = target }
  btn.addEventListener('click', retry)
  window.addEventListener('online', retry)
</script>
</body>
</html>
